[project]
name = "youtube-current-data-mcp"
version = "0.1.0"
description = "Read-only YouTube data bridge for ChatGPT and other MCP clients"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
# Test-only dependencies (not needed at runtime, so not in `dependencies`).
# Both CI test jobs install `.[test]`; tests/test_generators.py imports yaml.
test = [
  "PyYAML>=6",
]
# The public MCP edge component (Stage 0/1) is built on Starlette + httpx +
# uvicorn, all of which are already brought in transitively by `mcp` (see
# uv.lock). Declaring them via this extra makes the edge's direct imports
# explicit and future-proofs the dependency set if the edge is ever split out
# of the core graph. No new dependency tree is introduced.
edge = [
  "starlette",
  "httpx",
  "uvicorn",
  # JWT/JWKS verification for the optional OAuth Resource Server (Stage 3).
  # Already in the dependency tree transitively via `mcp` (which depends on
  # pyjwt[crypto]); declared here explicitly because the edge imports it
  # directly. Established, maintained JWS/JWK library.
  "pyjwt>=2.13,<3",
]

[project.urls]
Homepage = "https://github.com/Dracoform/chatgpt-youtube-mcp"
Repository = "https://github.com/Dracoform/chatgpt-youtube-mcp"
Issues = "https://github.com/Dracoform/chatgpt-youtube-mcp/issues"

[project.scripts]
youtube-current-data-mcp = "youtube_mcp.server:main"
youtube-mcp-edge = "youtube_mcp_edge.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_mcp", "src/youtube_mcp_edge"]
