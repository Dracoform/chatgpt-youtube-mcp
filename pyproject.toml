[project]
name = "youtube-current-data-mcp"
version = "0.1.0"
description = "Read-only YouTube data bridge for ChatGPT and other MCP clients"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
# Test-only dependencies (not needed at runtime, so not in `dependencies`).
# Both CI test jobs install `.[test]`; tests/test_generators.py imports yaml.
test = [
  "PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/Dracoform/chatgpt-youtube-mcp"
Repository = "https://github.com/Dracoform/chatgpt-youtube-mcp"
Issues = "https://github.com/Dracoform/chatgpt-youtube-mcp/issues"

[project.scripts]
youtube-current-data-mcp = "youtube_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_mcp"]
